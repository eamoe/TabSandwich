<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Tab Sandwich icon redrawn on a 32 grid (the toolbar and extensions menu on high-resolution screens):
       every edge on a whole pixel, and the tile fills the square. Chrome adds its own spacing around
       toolbar icons; only the 128 px Store icon keeps a transparent margin. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A71E0"/>
      <stop offset="1" stop-color="#584FA3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#tile)"/>
  <path d="M5 15 L7 9 Q7.7 7 9.8 7 H22.2 Q24.3 7 25 9 L27 15 Z" fill="#FFFFFF"/>
  <rect x="4" y="16" width="24" height="4" rx="2" fill="#FFC24B"/>
  <rect x="5" y="21" width="22" height="5" rx="2.5" fill="#FFFFFF"/>
</svg>
