# Every automated check, in one place. Called by ci.yml (every pull request and push to main)
# and by release.yml (every version tag), so a release is checked exactly like a pull request.
name: Checks

on:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs the pnpm version pinned in package.json's "packageManager". Must come before
      # setup-node, whose pnpm cache needs pnpm to already be available.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Logic tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium for the robot tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Robot tests (built extension in a real Chromium, plus accessibility scan)
        run: pnpm test:e2e

      - name: Keep the robot-test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Keep the built extension
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # Approved screenshots (tests/visual): every screen in light and dark, compared pixel for pixel.
  # Runs in Playwright's Docker image so it renders exactly like `pnpm visual` does locally.
  # The image tag must match @playwright/test's version (package.json, scripts/visual-docker.sh).
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Compare every screen with its approved screenshot
        run: pnpm test:visual

      - name: Keep the expected / actual / diff report when a screen changed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
